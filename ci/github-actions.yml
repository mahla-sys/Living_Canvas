# Living Canvas CI definition. This repository keeps its code in English and the agent account that maintains
# the branch cannot write under .github/workflows/ (GitHub App permission), so the file lives here.
# To activate:  cp ci/github-actions.yml .github/workflows/ci.yml && git add .github/workflows
#
# The commands the codebase is judged by (docs/ARCHITECTURE.md #11.3).
# `npm run build` already runs `tsc --noEmit` first, so the type gate is not optional here.
# The last step is a documentation gate: ARCHITECTURE.md §3.4 quotes line numbers inside engine.ts, and a
# stale number in a reference doc is worse than no number. Fixing it is one command: node scripts/doc-anchors.mjs

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: language check (RTL confined to docs/, no bidi controls anywhere)
        run: node scripts/check-english.mjs
      - name: Documentation references resolve
        run: node scripts/check-docs.mjs
      - name: Architecture doc anchors are current
        run: node scripts/doc-anchors.mjs --check
